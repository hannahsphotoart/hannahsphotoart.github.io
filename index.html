<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hannah Kittner | Hannahs Photoart</title>
  <meta name="description" content="Hannahs Photoart – Fotografie, Portfolio, Uploads und Shooting-Anfragen.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --white: #ffffff;
      --black: #111111;
      --text-muted: #777777;
      --gold: #b8a25e;
      --gold-dark: #9f8d53;
      --border-width: 1.5px;
      --content-padding: 16px;
      --block-gap: 16px;
      --slide-gap: 14px;
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background: var(--white);
      color: var(--black);
      font-family: "Inter", Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 390px;
      padding-bottom: 18px;
      background: var(--white);
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      height: 180px;
      overflow: hidden;
      border-radius: 0 0 28px 28px;
      background: #f7f7f7;
    }

    .hero img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 60%;
      transform: scale(1.4);
      transform-origin: center center;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 90px;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(255,255,255,0), #fff);
    }

    /* ── PROFILE ── */
    .profile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -75px;
    }

    .profile-image {
      position: relative;
      z-index: 2;
      width: 150px;
      height: 150px;
    }

    .avatar {
      position: relative;
      z-index: 1;
      width: 150px;
      height: 150px;
      overflow: hidden;
      border: 7px solid var(--white);
      border-radius: 50%;
      background: var(--white);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .badge {
      position: absolute;
      z-index: 5;
      right: 6px;
      bottom: 6px;
      width: 40px;
      height: 40px;
      overflow: hidden;
      border-radius: 50%;
      background: var(--white);
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge img {
      width: 24px;
      height: 24px;
      display: block;
      object-fit: contain;
    }

    .name {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
    }

    .name h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--black);
    }

    .name img {
      width: 18px;
      height: 18px;
      display: block;
      object-fit: contain;
    }

    .sub {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
    }

    /* ── SOCIAL ICONS ── */
    .socials {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 20px;
    }

    .socials a {
      width: 27px;
      height: 27px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s ease, opacity .2s ease;
    }

    .socials a:hover {
      transform: translateY(-1px);
      opacity: .78;
    }

    .socials img {
      width: 26px;
      height: 26px;
      display: block;
      object-fit: contain;
    }

    /* ── LINKS ── */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: var(--block-gap);
      margin-top: 20px;
      padding: 0 var(--content-padding);
    }

    .btn {
      width: 100%;
      min-height: 58px;
      padding: 15px 18px;
      border: var(--border-width) solid var(--gold);
      border-radius: 50px;
      background: var(--white);
      color: var(--gold-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.25;
      transition: background .22s ease, transform .16s ease, box-shadow .22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover {
      background: rgba(184, 162, 94, .06);
      box-shadow: 0 5px 16px rgba(184, 162, 94, .12);
    }

    .btn:active { transform: scale(.985); }

    .btn img,
    .btn svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      display: block;
      object-fit: contain;
      color: var(--gold);
    }

    .map-btn {
      font-size: 14px;
    }

    /* ── PORTFOLIO ── */
    .portfolio {
      margin: var(--block-gap) var(--content-padding) 0;
      padding: 16px;
      overflow: hidden;
      border: var(--border-width) solid var(--gold);
      border-radius: 25px;
      background: var(--white);
    }

    .portfolio-title {
      margin-bottom: 16px;
      color: var(--gold-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 500;
    }

    .portfolio-title img {
      width: 18px;
      height: 18px;
      display: block;
      object-fit: contain;
    }

    /* ── SEAMLESS SLIDER ── */
    .slider-wrapper {
      position: relative;
      overflow: hidden;
    }

    .slider {
      width: max-content;
      display: flex;
      animation: slider-scroll 15s linear infinite;
      will-change: transform;
    }

    .slider-group {
      display: flex;
      gap: var(--slide-gap);
      padding-right: var(--slide-gap);
    }

    .slider img {
      width: auto;
      height: 150px;
      display: block;
      flex: 0 0 auto;
      border-radius: 14px;
      object-fit: cover;
    }

    .slider-wrapper::before,
    .slider-wrapper::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      width: 42px;
      pointer-events: none;
    }

    .slider-wrapper::before {
      left: 0;
      background: linear-gradient(to right, #fff, rgba(255,255,255,0));
    }

    .slider-wrapper::after {
      right: 0;
      background: linear-gradient(to left, #fff, rgba(255,255,255,0));
    }

    @keyframes slider-scroll {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-50%, 0, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .slider { animation: none; }
      .slider-wrapper { overflow-x: auto; scrollbar-width: none; }
      .slider-wrapper::-webkit-scrollbar { display: none; }
    }

    @media (max-width: 350px) {
      .container { max-width: 100%; }
      .map-btn { font-size: 13px; }
      .name h1 { font-size: 19px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <!-- HERO -->
    <header class="hero">
      <img src="cover.png" alt="Berglandschaft mit Hannah" fetchpriority="high" decoding="async">
    </header>

    <!-- PROFILE -->
    <section class="profile" aria-label="Profil">
      <div class="profile-image">
        <div class="avatar">
          <img src="profile.png" alt="Portrait von Hannah Kittner" decoding="async">
        </div>

        <div class="badge" aria-hidden="true">
          <img src="profile-camera-heart.png" alt="">
        </div>
      </div>

      <div class="name">
        <h1>Hannah Kittner</h1>
        <img src="verified.png" alt="Verifiziert">
      </div>

      <p class="sub">Photographer | Creator | Traveler</p>

      <nav class="socials" aria-label="Social Media und Kontakt">
        <a href="https://www.instagram.com/hannahs.photoart" target="_blank" rel="noopener noreferrer" aria-label="Instagram öffnen">
          <img src="instagram.png" alt="">
        </a>
        <a href="https://www.tiktok.com/@hannahs.photoart" target="_blank" rel="noopener noreferrer" aria-label="TikTok öffnen">
          <img src="tiktok.png" alt="">
        </a>
        <a href="mailto:hannahkittner.business@gmail.com" aria-label="E-Mail an Hannah schreiben">
          <img src="telegram.png" alt="">
        </a>
      </nav>
    </section>

    <!-- BUTTONS -->
    <nav class="buttons" aria-label="Wichtige Links">
      <a class="btn" href="https://hannahs-photoart.onepage.me/" target="_blank" rel="noopener noreferrer">
        <img src="sparkles.png" alt="">
        <span>Website</span>
      </a>

      <a class="btn" href="https://hannah-kittner.onepage.me/angebot" target="_blank" rel="noopener noreferrer">
        <img src="Ring.png" alt="">
        <span>Hochzeits-Einführungsangebot</span>
      </a>

      <a class="btn" href="https://tally.so/r/b5XNKZ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21s7-6.1 7-12A7 7 0 1 0 5 9c0 5.9 7 12 7 12Z"></path>
          <circle cx="12" cy="9" r="2.35"></circle>
        </svg>
        <span>Shooting-Tour-2026</span>
      </a>


      <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSeAV8l5K9KIC28VzkeptfJPulCatApT4P5HWxTz_rmWnk8ikg/viewform?usp=header" target="_blank" rel="noopener noreferrer">
        <img src="Love Kalender.png" alt="">
        <span>Blind Date Fotoshooting</span>
      </a>

    </nav>

    <!-- PORTFOLIO -->
    <section class="portfolio" aria-label="Portfolio Highlights">
      <div class="portfolio-title">
        <img src="gallery-icon.png" alt="">
        <span>Portfolio Highlights</span>
      </div>

      <div class="slider-wrapper">
        <div class="slider">
          <div class="slider-group">
            <img src="highlight-1.png" alt="Portfolioaufnahme 1" loading="lazy" decoding="async">
            <img src="highlight-2.png" alt="Portfolioaufnahme 2" loading="lazy" decoding="async">
            <img src="highlight-3.png" alt="Portfolioaufnahme 3" loading="lazy" decoding="async">
            <img src="highlight-4.png" alt="Portfolioaufnahme 4" loading="lazy" decoding="async">
          </div>

          <div class="slider-group" aria-hidden="true">
            <img src="highlight-1.png" alt="" loading="lazy" decoding="async">
            <img src="highlight-2.png" alt="" loading="lazy" decoding="async">
            <img src="highlight-3.png" alt="" loading="lazy" decoding="async">
            <img src="highlight-4.png" alt="" loading="lazy" decoding="async">
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
